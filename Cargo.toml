[package]
name = "openai-oauth-proxy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local OpenAI-compatible proxy bridging API-key clients to ChatGPT OAuth sessions"
readme = "README.md"

[dependencies]
base64 = "=0.21.7"
rand = "=0.7.3"
sha2 = "=0.10.8"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
shellexpand = "=2.1.2"
url = "=2.5.7"
urlencoding = "=2.1.3"
opener = "=0.8.4"
anyhow = "=1.0.81"
indexmap = "=2.2.6"
clap = { version = "=4.5.4", features = ["derive"] }
axum = "=0.7.5"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "=0.5.2", features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
